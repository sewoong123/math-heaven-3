  x.font='19px ui-monospace, Menlo, Consolas, monospace'; x.fillStyle='#5a3b8c'; var lines=[], u=url; while(u.length){ lines.push(u.slice(0,56)); u=u.slice(56); } lines.slice(0,3).forEach(function(l,i){ x.fillText(l,W/2,1030+i*26); });
  return c.toDataURL('image/png'); }
function download(dataUrl,file){ try{ var a=document.createElement('a'); a.href=dataUrl; a.download=file; document.body.appendChild(a); a.click(); a.remove(); }catch(e){} }
function copy(text,btn){ var done=function(){ var o=btn.textContent; btn.textContent='복사됨!'; setTimeout(function(){btn.textContent=o;},1200); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,function(){ fallback(); }); } else fallback();
  function fallback(){ var t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); var ok=false; try{ ok=document.execCommand('copy'); }catch(e){} t.remove(); if(ok) done(); else prompt('아래 주소를 복사하세요 (Ctrl+C)',text); } }
function ask(title,body,yes){ return new Promise(function(res){ $('#dlgT').textContent=title; $('#dlgB').innerHTML=body; $('#dlgYes').textContent=yes||'확인'; $('#dlg').hidden=false;
  $('#dlgYes').onclick=function(){ var v=$('#dlgB input'); $('#dlg').hidden=true; res(v?v.value:true); }; $('#dlgNo').onclick=function(){ $('#dlg').hidden=true; res(false); }; var i=$('#dlgB input'); if(i) setTimeout(function(){i.focus();},50); }); }
function fdate(t){ if(!t) return ''; var d=new Date(t); return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate(); }

var SUPA=window.SUPA;
var BASE=(location.origin+location.pathname.replace(/[^\/]*$/,'')).replace(/\/$/,'');
function linkOf(code){ return BASE+'/?s='+code; }
function rpc(fn,body){ return fetch(SUPA.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SUPA.key,'Content-Type':'application/json'},body:JSON.stringify(body||{})})
  .then(function(r){ return r.text().then(function(t){ var j=null; try{ j=t?JSON.parse(t):null; }catch(e){} if(!r.ok) throw ((j&&j.message)||('오류 '+r.status)); return j; }); }, function(){ throw '인터넷 연결을 확인해 주세요.'; }); }
var $=function(s){return document.querySelector(s);};
function mine(){ try{ return JSON.parse(localStorage.getItem('m3h_mine')||'[]'); }catch(e){ return []; } }
function saveMine(list){ try{ localStorage.setItem('m3h_mine',JSON.stringify(list)); }catch(e){} }
function remember(s){ var l=mine().filter(function(x){return x.code!==s.code;}); l.unshift({code:s.code,name:s.name,manage:s.manage}); saveMine(l.slice(0,20)); drawMine(); }
function forget(code){ saveMine(mine().filter(function(x){return x.code!==code;})); drawMine(); }
function memo(s){ var t='중3 수학천국 · '+s.name+'\r\n\r\n학생 접속 주소: '+linkOf(s.code)+'\r\n학교 코드: '+s.code+'\r\n관리 코드: '+s.manage+'\r\n\r\n※ 관리 코드가 있으면 학교 이름 바꾸기, 기록 초기화, 학교 삭제를 할 수 있어요. 학생들에게는 알려 주지 마세요.\r\n관리 페이지: '+BASE+'/new.html\r\n';
  download('data:text/plain;charset=utf-8,'+encodeURIComponent('﻿'+t),'수학천국_'+s.name+'_관리정보.txt'); }
function msg(el,t,err){ el.textContent=t||''; el.className='msg'+(err?' err':''); }

/* 탭 */
function tab(n){ $('#tA').classList.toggle('on',n===0); $('#tB').classList.toggle('on',n===1); $('#pA').hidden=n!==0; $('#pB').hidden=n!==1; }
$('#tA').onclick=function(){ tab(0); }; $('#tB').onclick=function(){ tab(1); };

/* 만들기 */
$('#mk').onclick=function(){ var v=$('#nm').value.trim(); if(v.length<2){ msg($('#mkMsg'),'학교 이름을 2글자 이상 입력해 주세요.',true); return; }
  $('#mk').disabled=true; msg($('#mkMsg'),'만드는 중…');
  rpc('public_create',{p_name:v}).then(function(s){ $('#nm').value=''; msg($('#mkMsg'),''); remember(s); showMade(s); })
  .catch(function(e){ msg($('#mkMsg'),e,true); }).then(function(){ $('#mk').disabled=false; }); };
$('#nm').onkeydown=function(e){ if(e.key==='Enter') $('#mk').click(); };
function showMade(s){ var url=linkOf(s.code);
  $('#made').innerHTML='<div class="made"><img alt="QR코드" src="'+qrImg(url,400)+'"><div class="info"><div class="nm">'+esc(s.name)+' <span class="code">'+s.code+'</span></div>'+
    '<div class="lbl">학생 접속 주소</div><div class="url">'+esc(url)+'</div>'+
    '<div class="lbl">관리 코드 <b>(꼭 적어 두세요!)</b></div><div class="mcode">'+esc(s.manage)+'</div>'+
    '<div class="warn">관리 코드는 이 기기의 목록에만 남고 다른 곳에서는 다시 볼 수 없어요. 잃어버리면 이름 바꾸기·기록 초기화·삭제를 할 수 없으니 메모로 저장해 두세요. 학생들에게는 알려 주지 마세요.</div>'+
    '<div class="row"><button class="sm" id="c1">주소 복사</button><button class="sm" id="c2">QR 이미지 저장</button><button class="sm gold" id="c3">안내문 이미지 저장</button><button class="sm mint" id="c4">관리 정보 메모 저장</button></div></div></div>';
  $('#c1').onclick=function(){ copy(url,$('#c1')); }; $('#c2').onclick=function(){ download(qrImg(url,600),'QR_'+s.name+'.png'); };
  $('#c3').onclick=function(){ showPoster(s.name,url); }; $('#c4').onclick=function(){ memo(s); }; }
function showPoster(name,url){ var src=posterImg(name,url); ask(name+' 안내문','<img class="poster" src="'+src+'" alt="안내문"><p class="msg">이미지를 길게 누르거나 오른쪽 클릭해서 저장할 수도 있어요.</p>','이미지 저장').then(function(ok){ if(ok) download(src,'안내문_'+name+'.png'); }); }

/* 이 기기에서 만든 학교 */
function drawMine(){ var l=mine(), box=$('#mine');
  if(!l.length){ box.innerHTML='<div class="empty">아직 없어요.</div>'; return; }
  box.innerHTML=l.map(function(s){ return '<div class="sch"><div><div class="t">'+esc(s.name)+' <span class="code">'+s.code+'</span></div><div class="meta">관리 코드 '+esc(s.manage)+'</div></div><div class="acts"><button class="sm" data-c="'+s.code+'" data-a="go">관리하기</button><button class="sm" data-c="'+s.code+'" data-a="memo">메모 저장</button></div></div>'; }).join('');
  box.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ var s=mine().filter(function(x){return x.code===b.dataset.c;})[0]; if(!s) return;
    if(b.dataset.a==='memo') memo(s); else { tab(1); $('#mc').value=s.code; $('#mm').value=s.manage; $('#load').click(); } }; }); }

/* 관리하기 */
var CUR=null;
$('#load').onclick=function(){ var c=$('#mc').value.trim(), m=$('#mm').value.trim(); if(!c||!m){ msg($('#mgMsg'),'학교 코드와 관리 코드를 모두 입력해 주세요.',true); return; }
  $('#load').disabled=true; msg($('#mgMsg'),'불러오는 중…');
  rpc('my_school',{p_code:c,p_manage:m}).then(function(d){ CUR={code:d.code,name:d.name,manage:m}; msg($('#mgMsg'),''); drawMy(d); })
  .catch(function(e){ msg($('#mgMsg'),e,true); $('#my').innerHTML=''; }).then(function(){ $('#load').disabled=false; }); };
function drawMy(d){ var url=linkOf(d.code);
  $('#my').innerHTML='<div class="made"><img alt="QR코드" src="'+qrImg(url,400)+'"><div class="info"><div class="nm">'+esc(d.name)+' <span class="code">'+d.code+'</span></div>'+
    '<div class="meta">학생 '+d.players+'명 · 기록 '+d.records+'개 · 만든 날 '+fdate(d.created)+'</div><div class="url">'+esc(url)+'</div>'+
    '<div class="row"><button class="sm" id="d1">주소 복사</button><button class="sm" id="d2">QR 이미지 저장</button><button class="sm gold" id="d3">안내문 이미지 저장</button><button class="sm" id="d7">링크 열어 보기</button></div>'+
    '<div class="row"><button class="sm" id="d4">이름 바꾸기</button><button class="sm danger" id="d5">기록 모두 초기화</button><button class="sm danger" id="d6">학교 삭제</button></div></div></div>';
  $('#d1').onclick=function(){ copy(url,$('#d1')); }; $('#d2').onclick=function(){ download(qrImg(url,600),'QR_'+d.name+'.png'); }; $('#d3').onclick=function(){ showPoster(d.name,url); }; $('#d7').onclick=function(){ window.open(url,'_blank'); };
  $('#d4').onclick=function(){ ask('학교 이름 바꾸기','<input value="'+esc(d.name)+'" maxlength="30" style="width:100%">').then(function(v){ if(!v) return; rpc('my_rename',{p_code:CUR.code,p_manage:CUR.manage,p_name:v}).then(function(n){ CUR.name=n.name; var l=mine(); l.forEach(function(x){ if(x.code===n.code) x.name=n.name; }); saveMine(l); drawMine(); drawMy(n); }).catch(err); }); };
  $('#d5').onclick=function(){ ask('기록을 모두 초기화할까요?','<p style="line-height:1.6"><b>'+esc(d.name)+'</b> 학생들의 기록 <b>'+d.records+'개</b>가 모두 지워져요. 링크는 그대로 쓸 수 있어요. 되돌릴 수 없어요.</p>').then(function(ok){ if(!ok) return; rpc('my_reset',{p_code:CUR.code,p_manage:CUR.manage}).then(drawMy).catch(err); }); };
  $('#d6').onclick=function(){ ask('학교를 삭제할까요?','<p style="line-height:1.6"><b>'+esc(d.name)+'</b> 링크가 더 이상 열리지 않고 기록도 모두 지워져요. 되돌릴 수 없어요.</p>').then(function(ok){ if(!ok) return; rpc('my_delete',{p_code:CUR.code,p_manage:CUR.manage}).then(function(){ forget(CUR.code); CUR=null; $('#my').innerHTML=''; msg($('#mgMsg'),'삭제했어요.'); }).catch(err); }); }; }
function err(e){ ask('문제가 생겼어요','<p>'+esc(e)+'</p>'); }

if(!SUPA||!SUPA.url){ $('.sub').textContent='Supabase 연결 정보가 없어요.'; }
drawMine();

})();
</script>
</body>
</html>
